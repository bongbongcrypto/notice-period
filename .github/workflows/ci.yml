name: ci

# Build, tests, mutation check and a dry run of the deploy and loop scripts on local anvil chains.
# No environment, no secret, no network writes.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - name: Check out this commit (plain git, no third-party action)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %s'

      - name: Install pinned Foundry, solc and libraries
        run: bash scripts/ci-setup.sh

      - name: Show the compiler Foundry will use
        run: forge config --json | python3 -c "import json,sys; c=json.load(sys.stdin); print('solc', c.get('solc') or c.get('solc_version'), 'evm', c['evm_version'], 'offline', c['offline'])"

      - name: Build
        run: forge build --sizes

      - name: Tests (unit, fuzz, invariant)
        run: forge test -vv

  mutation:
    # Removes one refusal rule at a time (scripts/mutations.py); the named test must fail on every mutant.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FOUNDRY_PROFILE: mutation
    steps:
      - name: Check out this commit (plain git, no third-party action)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Install pinned Foundry, solc and libraries
        run: bash scripts/ci-setup.sh

      - name: List the rules under test
        run: python3 scripts/mutate.py --list

      - name: Mutation check (every refusal rule has a test that fails without it)
        run: python3 scripts/mutate.py

  dry-run:
    # The deploy and loop scripts of the testnet workflows, run against two local anvil chains with the mock network
    # contracts at the real addresses and a relay that plays the network. Nothing leaves the runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: ci
      # Public anvil development keys (accounts 0 and 1 of anvil's default mnemonic), valid on the local chains only.
      DEPLOY_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      RELAY_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
      SUBSCRIBE_GRACE: "1"
      LOOP_TIMEOUT: "120"
    steps:
      - name: Check out this commit (plain git, no third-party action)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Install pinned Foundry, solc and libraries
        run: bash scripts/ci-setup.sh

      - name: Lint the shell scripts
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/mutate.py scripts/mutations.py scripts/relay-anvil.py scripts/dry-run-fund.py \
            scripts/wait-log.py scripts/test-wait-log.py

      - name: Log wait against a stub RPC (403 default agent, 413 wide ranges, failed chunk, lagging node)
        run: python3 scripts/test-wait-log.py

      - name: Dry run on local chains (deploy-hello, deploy-system, loop hello, loop system mode 0 and 1)
        run: bash scripts/dry-run.sh

      - name: Funding dry run (three local chains, transaction and refusal checks)
        run: bash scripts/dry-run-fund.sh
