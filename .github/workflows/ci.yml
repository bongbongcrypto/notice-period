name: ci

# Build, tests, mutation check and a dry run of the deploy and loop scripts on local anvil chains.
# No environment, no secret, no network writes.
on:
  push:
    # The page and prose do not change what these jobs check. A push that touches anything else still runs them.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - name: Check out this commit (plain git, no third-party action)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %s'

      - name: Install pinned Foundry, solc and libraries
        run: bash scripts/ci-setup.sh

      - name: Show the compiler Foundry will use
        run: forge config --json | python3 -c "import json,sys; c=json.load(sys.stdin); print('solc', c.get('solc') or c.get('solc_version'), 'evm', c['evm_version'], 'offline', c['offline'])"

      - name: Build
        run: forge build --sizes

      - name: Tests (unit, fuzz, invariant)
        run: forge test -vv

  mutation:
    # Removes one refusal rule at a time (scripts/mutations.py); the named test must fail on every mutant.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FOUNDRY_PROFILE: mutation
    steps:
      - name: Check out this commit (plain git, no third-party action)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Install pinned Foundry, solc and libraries
        run: bash scripts/ci-setup.sh

      - name: List the rules under test
        run: python3 scripts/mutate.py --list

      - name: Mutation check (every refusal rule has a test that fails without it)
        run: python3 scripts/mutate.py

  dry-run:
    # The deploy and loop scripts of the testnet workflows, run against two local anvil chains with the mock network
    # contracts at the real addresses and a relay that plays the network. Nothing is sent from the runner; the one
    # network read is Morpho's factory code from Base Sepolia (scripts/dry-run.sh header).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      # real | unpinned | mock: whether Morpho's factory code in the dry run was checked against the pinned sha256.
      factory_bytecode: ${{ steps.dryrun.outputs.factory_bytecode }}
    env:
      FOUNDRY_PROFILE: ci
      # Public anvil development keys (accounts 0 and 1 of anvil's default mnemonic), valid on the local chains only.
      DEPLOY_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      RELAY_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
      SUBSCRIBE_GRACE: "1"
      LOOP_TIMEOUT: "120"
    steps:
      - name: Check out this commit (plain git, no third-party action)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Install pinned Foundry, solc and libraries
        run: bash scripts/ci-setup.sh

      - name: Lint the shell scripts
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/mutate.py scripts/mutations.py scripts/relay-anvil.py scripts/dry-run-fund.py \
            scripts/wait-log.py scripts/test-wait-log.py scripts/stamp.py scripts/test-stamp.py scripts/keccak.py \
            scripts/rpclib.py scripts/logs.py scripts/deployment.py scripts/bytecode_match.py \
            scripts/test-bytecode-match.py scripts/sourcify.py scripts/runs.py scripts/test-runs.py \
            scripts/replay_mainnet.py scripts/check-workflows.py scripts/check-values.py

      - name: Stamp check on a scratch copy (a hand edit inside a stamped block must fail)
        run: python3 scripts/test-stamp.py

      - name: Workflow checks (inputs mapped, timeouts, environments, no outside actions; deployed values match the tests)
        run: |
          python3 scripts/check-workflows.py
          python3 scripts/check-values.py

      - name: Page walk signer rules (no key, no browser, no network)
        run: |
          node --version
          # the runner's own node; the test needs only ES modules, top-level await and BigInt. It answers the signer's
          # chain reads itself (fetch is replaced by a function of the test), so nothing leaves the runner.
          node -e 'if (Number(process.versions.node.split(".")[0]) < 18) { console.error("Node 18 or later is needed"); process.exit(1); }'
          node --check scripts/page-walk.mjs
          node --check scripts/test-page-walk.mjs
          node scripts/test-page-walk.mjs

      - name: Offline self-tests (Keccak, bytecode match, run records, deployment file)
        run: |
          python3 -c 'import sys; sys.path.insert(0, "scripts"); import keccak; keccak.self_test(); print("keccak self-test passed")'
          python3 scripts/test-bytecode-match.py
          python3 scripts/test-runs.py
          for f in deployments/2*.json; do n="$(basename "$f" .json)"; python3 scripts/deployment.py "$n"; done

      - name: Log wait against a stub RPC (403 default agent, 413 wide ranges, failed chunk, lagging node)
        run: python3 scripts/test-wait-log.py

      - name: Dry run on local chains (deploy-hello, deploy-system, loop hello, every kind, every loop action but a stand-alone cancel, health; revoke-stays and burst only with Morpho's real factory code)
        id: dryrun
        run: bash scripts/dry-run.sh

      - name: Funding dry run (three local chains, transaction and refusal checks)
        run: bash scripts/dry-run-fund.sh

  fork:
    # Non-blocking: fork/RealVault.fork.t.sol (F2, F2b) on Ethereum mainnet state at block 26,406,895, read from a
    # public archive endpoint. No key, no secret, no transaction. The file sits outside test/, so the blocking jobs
    # never compile it; this job points Foundry's test directory at fork/ (FOUNDRY_TEST overrides foundry.toml).
    # A red job does not fail the run: read the job's own conclusion (gh run view <id> --json jobs).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      FOUNDRY_PROFILE: ci
      FOUNDRY_TEST: fork
      # Optional repository variable, tried first. Keyless URLs only: variables are not masked in logs.
      FORK_RPC: ${{ vars.FORK_RPC }}
    steps:
      - name: Check out this commit (plain git, no third-party action)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Install pinned Foundry, solc and libraries
        run: bash scripts/ci-setup.sh

      - name: Fork tests F2 and F2b (first archive endpoint that completes them)
        run: |
          set -o pipefail
          # ci-setup.sh forbids downloads (FOUNDRY_OFFLINE=true); a fork must reach the RPC. solc stays pinned.
          unset FOUNDRY_OFFLINE
          forge config --json | python3 -c "import json, sys; c = json.load(sys.stdin); print('test dir', c['test'], 'offline', c['offline']); sys.exit(0 if str(c['test']).rstrip('/').split('/')[-1] == 'fork' else 1)" \
            || { echo "Foundry's test directory is not fork/"; exit 1; }
          out="$RUNNER_TEMP/fork-test.log"
          for url in "${FORK_RPC}" https://eth.drpc.org https://rpc.mevblocker.io https://eth-mainnet.public.blastapi.io; do
            [ -n "$url" ] || continue
            if [ "$url" = "${FORK_RPC}" ]; then echo "endpoint: repository variable FORK_RPC"; else echo "endpoint: $url"; fi
            # One test at a time: four forks at once on one free endpoint invite rate limits (--threads, Foundry v1.9.0).
            if ETH_RPC="$url" forge test --threads 1 --match-path 'fork/*' -vvv 2>&1 | tee "$out"; then
              # A skipped or missing test would also exit 0: the four must show as passed.
              for t in test_F2_realSubmit_redeemsHolder_at1000000 test_F2_realSubmit_notRedeemed_at600000 \
                test_F2b_allocatorClearsLiquidityAdapter_endsRedeemFailed test_F2b_control_sameHolderRedeems_withLiquidityAdapter; do
                grep -q "\[PASS\] ${t}(" "$out" || { echo "fork test $t did not pass with this endpoint"; exit 1; }
              done
              echo "ETH_RPC=$url" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "fork tests did not pass with this endpoint; trying the next one"
          done
          echo "fork tests did not pass with any endpoint"
          exit 1

      - name: Same tests with call isolation (cross-check only; each top-level call is its own transaction)
        # Unverified with this harness; its result is informational and never turns the job red.
        continue-on-error: true
        run: |
          unset FOUNDRY_OFFLINE
          forge test --threads 1 --isolate --match-path 'fork/*' -vvv
