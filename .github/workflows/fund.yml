name: fund

# Manual only, inside the main-only testnet environment. Uses faucet-funded Sepolia ETH only.
on:
  workflow_dispatch:
    inputs:
      react_eth:
        description: "Sepolia ETH for lREACT on Lasna (0 skips, at most 2)"
        default: "0.1"
        required: true
      base_eth:
        description: "Sepolia ETH to bridge to Base Sepolia (0 skips, at most 0.2)"
        default: "0.05"
        required: true

permissions:
  contents: read

concurrency:
  group: testnet-key
  cancel-in-progress: false

jobs:
  fund:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: testnet
    steps:
      - name: Check out this commit (plain git, no third-party action)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %s'

      - name: Install pinned Foundry, solc and libraries
        run: bash scripts/ci-setup.sh

      - name: Fund Lasna and Base Sepolia (receipts and balance changes in summary)
        env:
          DEPLOY_KEY: ${{ secrets.TESTNET_KEY }}
          TESTNET_ADDRESS: ${{ vars.TESTNET_ADDRESS }}
          REACT_ETH: ${{ inputs.react_eth }}
          BASE_ETH: ${{ inputs.base_eth }}
        run: bash scripts/fund.sh
