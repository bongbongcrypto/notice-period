[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Pinned compiler and EVM target (see SPEC.md section 13). CI points solc_version at a checksum-verified binary.
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = []
remappings = [
    "@reactive/=lib/reactive-lib-omni/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512
seed = "0x4e50"

[invariant]
runs = 64
depth = 40
fail_on_revert = false

[profile.ci.fuzz]
runs = 2000
seed = "0x4e50"

[profile.ci.invariant]
runs = 128
depth = 60
fail_on_revert = false

# Used by the mutation check: short fuzz runs, the named test is what matters.
[profile.mutation.fuzz]
runs = 64
seed = "0x4e50"

[profile.mutation.invariant]
runs = 16
depth = 30
fail_on_revert = false
